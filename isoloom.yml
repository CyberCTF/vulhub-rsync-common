# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Rsync Unauthorized Access (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's rsync/common, vendored unchanged in app/ and built by its Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-rsync-common

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.64.0/24, internet: false}

machines:
  rsync:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      rsync:
        port: 873
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: app

checks:
  - name: the rsync daemon answers
    tcp: rsync:873
    wait: 60
  - name: the daemon greets with the rsync protocol and lists the src module
    script: checks/modules.sh

message: |
  An rsync daemon listens on 127.0.0.1:{{ machines.rsync.ports.rsync.published }}. List its modules:
  no password is asked.
